name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: ビルド
        run: pnpm build

      # ★不変条件テストは S2 で追加する。
      #   追加後はこのジョブをブロッキング条件とする（→ docs/architecture.md §5.3）
