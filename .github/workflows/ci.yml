name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ★バージョンは package.json の packageManager に従う。
      #   ここで version を指定すると二重指定になり、
      #   セットアップの段階で落ちて**テストが一度も走らない**（実際に起きた）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Firestore エミュレータに必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ★ブロッキング条件（→ docs/architecture.md §5.3）
      #   状態遷移の全パス網羅 / G-3 スキーマ整合 / マスタの整合
      - name: ドメインテスト
        run: pnpm test

      # ★L0：クライアントから Firestore に到達できないことの検証
      - name: Firestore ルールテスト
        run: pnpm dlx firebase-tools@latest emulators:exec --only firestore "pnpm exec vitest run tests/rules"

      - name: ビルド
        run: pnpm build
